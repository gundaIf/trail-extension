<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>
    (function () {
      var t = "ink";
      try { t = localStorage.getItem("trail-theme") || "ink"; } catch (e) {}
      if (t === "dark") t = "ink";
      if (t === "default") t = "paper";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="head">
    <img class="mark" src="icons/icon32.png" width="22" height="22" alt="" />
    <span class="name">TRAIL</span>
    <span class="range">last hour</span>
  </div>

  <div class="big" id="total">—</div>
  <div class="sub" id="sub">across — places</div>
  <div class="list" id="list"></div>
  <button id="open" class="open" type="button">Open the observatory →</button>
  <div class="foot">Stored on this device only</div>
  <script src="popup.js"></script>
</body>
</html>
